<!DOCTYPE html>
<html lang="de">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0"/>
  <title>Moneytyp-Analyse</title>
  <style>
    * { box-sizing: border-box; margin: 0; padding: 0; }
    body { font-family: 'Inter', 'Helvetica Neue', sans-serif; background: linear-gradient(135deg, #fdf8f0, #fef9f4); min-height: 100vh; padding: 24px 16px; }
    .wrap { max-width: 560px; margin: 0 auto; }
    .header { text-align: center; margin-bottom: 32px; }
    .header .brand { font-size: 13px; letter-spacing: 3px; color: #b8975a; text-transform: uppercase; margin-bottom: 8px; }
    .header h1 { font-size: 26px; font-weight: 600; color: #2c2418; margin-bottom: 6px; }
    .header p { font-size: 13px; color: #9c8866; letter-spacing: 1px; }
    .divider { width: 40px; height: 1px; background: #b8975a; margin: 16px auto 0; }
    .card { background: white; border-radius: 16px; padding: 28px; box-shadow: 0 2px 20px rgba(184,151,90,0.12); margin-bottom: 20px; }
    label.section { display: block; font-size: 12px; letter-spacing: 2px; color: #b8975a; text-transform: uppercase; margin-bottom: 8px; }
    input[type=text], input[type=number] { width: 100%; padding: 12px 14px; border: 1.5px solid #e8dcc8; border-radius: 10px; background: #fdfaf6; color: #2c2418; font-size: 15px; font-family: inherit; outline: none; }
    .grid { display: grid; grid-template-columns: 1fr 1fr; gap: 12px; margin-top: 16px; }
    .type-box { background: #fdf8f0; border-radius: 10px; padding: 12px 14px; border: 1.5px solid #ede3d0; }
    .type-box .type-label { font-size: 12px; color: #9c8866; margin-bottom: 6px; }
    .type-box input { padding: 8px 10px; font-size: 18px; font-weight: bold; text-align: center; background: white; border: 1.5px solid #e0d4be; border-radius: 7px; }
    .btn { width: 100%; padding: 14px; background: linear-gradient(135deg, #c9a55a, #b8975a); color: white; border: none; border-radius: 10px; font-size: 14px; letter-spacing: 1.5px; text-transform: uppercase; cursor: pointer; font-family: inherit; margin-top: 24px; }
    .btn:disabled { background: #d4b87a; cursor: not-allowed; }
    .error { margin-top: 12px; padding: 10px 14px; background: #fff5f5; border: 1px solid #fcc; border-radius: 8px; font-size: 13px; color: #c0392b; }
    .result-header { display: flex; justify-content: space-between; align-items: center; margin-bottom: 16px; }
    .copy-btn { padding: 7px 16px; background: #fdf8f0; border: 1.5px solid #e0d4be; border-radius: 8px; font-size: 12px; color: #9c8866; cursor: pointer; font-family: inherit; }
    .copy-btn.copied { background: #e8f5e9; border-color: #81c784; color: #388e3c; }
    .result-box { background: #fdf8f0; border-radius: 12px; padding: 20px 18px; font-size: 14px; line-height: 1.75; color: #2c2418; white-space: pre-wrap; border-left: 3px solid #b8975a; }
    .footer { text-align: center; margin-top: 24px; font-size: 11px; color: #c4ab88; letter-spacing: 1px; }
    #result-card { display: none; }
  </style>
</head>
<body>
<div class="wrap">
  <div class="header">
    <div class="brand">Christina Sternbauer</div>
    <h1>Moneytyp-Analyse</h1>
    <p>WhatsApp-Nachricht Generator</p>
    <div class="divider"></div>
  </div>

  <div class="card">
    <label class="section">Vorname der Teilnehmerin</label>
    <input type="text" id="name" placeholder="z. B. Sandra" />

    <div style="margin-top:24px;">
      <label class="section">Testergebnis (Anzahl pro Typ)</label>
      <div class="grid">
        <div class="type-box"><div class="type-label">🔸 <strong>A</strong> · Visionär</div><input type="number" id="sA" min="0" max="16" placeholder="0"/></div>
        <div class="type-box"><div class="type-label">🔹 <strong>B</strong> · Sicherheitsliebende</div><input type="number" id="sB" min="0" max="16" placeholder="0"/></div>
        <div class="type-box"><div class="type-label">🔷 <strong>C</strong> · Energiefluss-Typ</div><input type="number" id="sC" min="0" max="16" placeholder="0"/></div>
        <div class="type-box"><div class="type-label">🔴 <strong>D</strong> · Macher</div><input type="number" id="sD" min="0" max="16" placeholder="0"/></div>
      </div>
    </div>

    <div id="error" class="error" style="display:none;"></div>
    <button class="btn" id="genBtn" onclick="generate()">✨ Nachricht generieren</button>
  </div>

  <div class="card" id="result-card">
    <div class="result-header">
      <label class="section" style="margin:0;">WhatsApp-Nachricht</label>
      <button class="copy-btn" id="copyBtn" onclick="copyText()">Kopieren</button>
    </div>
    <div class="result-box" id="resultBox"></div>
  </div>

  <div class="footer">Passion Works · by Conny 🌸</div>
</div>

<script>
const SYSTEM_PROMPT = `Du erhältst die Moneytyp-Testergebnisse einer Teilnehmerin der Planbar-Ausgebucht-Masterclass von Christina Sternbauer.

DIE 4 TYPEN:
A = Der Visionär – kreativ, ideenreich, mutig, denkt in Möglichkeiten; Herausforderung: Struktur & Fokus fehlen
B = Der Sicherheitsliebende – verlässlich, strukturiert, langfristig denkend; Herausforderung: Vorsicht bremst mutige Schritte
C = Der Energiefluss-Typ – intuitiv, leicht, energetisch, zieht durch Präsenz an; Herausforderung: fehlende Systeme & Greifbarkeit
D = Der Macher – strategisch, zielorientiert, ergebnisstark; Herausforderung: menschliche Verbindung & Balance

LOGIK:
- Höchste Zahl = dominanter Typ → trägt die Hauptbotschaft
- Zwei gleich hohe Zahlen → beide fließen gleichwertig ein
- Niedrige Typen → ignorieren

STRUKTUR (~10-12 Sätze):
1. Warme Begrüßung mit Vorname + Emoji
2. Auflösung: Welcher Typ (oder Kombi) sie ist – klar & erkennend, max. 2 Sätze
3. Typen-Überblick – immer einbauen, direkt nach der Auflösung:
🔸 A · Der Visionär – kreativ, mutig, denkt in Möglichkeiten
🔹 B · Der Sicherheitsliebende – verlässlich, strukturiert, langfristig
🔷 C · Der Energiefluss-Typ – intuitiv, leicht, zieht durch Präsenz an
🔴 D · Der Macher – strategisch, zielorientiert, ergebnisstark
Darunter: die konkreten Punktzahlen der Person (z. B. A 9 · C 6 · D 1 · B 0) – absteigend sortiert
4. Stärken spiegeln – konkret, kurze Sätze, je Punkt ein Emoji, 2-3 Sätze
5. Herausforderung – ohne Wertung, mit Verständnis, 1-2 Sätze
6. GENAU EINE Fokus-Aufgabe für die Masterclass – eingeleitet mit 👉, typ-spezifisch, aktivierend, 1-2 Sätze
7. EINE offene Abschlussfrage – warm, lädt zum Antworten ein, keine Ja/Nein-Frage
8. Abschluss immer mit: Herzensgrüße, Deine Conny 🌸

TON:
- Kurze Sätze, klare Sprache
- Mehrere passende Emojis – lebendig, nicht überladen
- Warm + spiegelnd + führend
- Kein Marketing, keine Coach-Phrasen, kein "Du bist toll" ohne Substanz
- Nicht mit "Ich" beginnen

NICHT:
- Kein Verweis auf Gespräch oder Verkauf
- Keine Bullet-Listen in der Nachricht
- Keine Fragen-Anhäufung am Ende
- Nicht mehr als eine Aufgabe`;

async function generate() {
  const name = document.getElementById('name').value.trim();
  const A = parseInt(document.getElementById('sA').value)||0;
  const B = parseInt(document.getElementById('sB').value)||0;
  const C = parseInt(document.getElementById('sC').value)||0;
  const D = parseInt(document.getElementById('sD').value)||0;
  const errEl = document.getElementById('error');

  if (!name) { showError("Bitte Vorname eingeben."); return; }
  if (A+B+C+D === 0) { showError("Bitte mindestens einen Wert eingeben."); return; }
  errEl.style.display = 'none';

  const sorted = [['A',A],['B',B],['C',C],['D',D]].sort((a,b)=>b[1]-a[1]);
  const max = sorted[0][1];
  const dominant = sorted.filter(([,v])=>v===max).map(([k])=>k);
  const scoreStr = sorted.map(([k,v])=>`${k}: ${v}`).join(', ');
  const userMsg = `Name: ${name}, ${scoreStr}. Dominanter Typ: ${dominant.join(' und ')}. Bitte schreibe die WhatsApp-Nachricht.`;

  const btn = document.getElementById('genBtn');
  btn.disabled = true;
  btn.textContent = '✨ Wird erstellt …';
  document.getElementById('result-card').style.display = 'none';

  try {
    const res = await fetch('/.netlify/functions/generate', {
      method: 'POST',
      headers: { 'Content-Type': 'application/json' },
      body: JSON.stringify({
        model: 'claude-sonnet-4-20250514',
        max_tokens: 1000,
        system: SYSTEM_PROMPT,
        messages: [{ role: 'user', content: userMsg }]
      })
    });
    const data = await res.json();
    const text = data?.content?.map(b=>b.text||'').join('') || '';
    if (!text) throw new Error('Leere Antwort.');
    document.getElementById('resultBox').textContent = text;
    document.getElementById('result-card').style.display = 'block';
  } catch(e) {
    showError('Fehler: ' + (e.message || 'Bitte nochmal versuchen.'));
  }

  btn.disabled = false;
  btn.textContent = '✨ Nachricht generieren';
}

function copyText() {
  const text = document.getElementById('resultBox').textContent;
  navigator.clipboard.writeText(text);
  const btn = document.getElementById('copyBtn');
  btn.textContent = '✓ Kopiert!';
  btn.classList.add('copied');
  setTimeout(()=>{ btn.textContent='Kopieren'; btn.classList.remove('copied'); }, 2000);
}

function showError(msg) {
  const el = document.getElementById('error');
  el.textContent = msg;
  el.style.display = 'block';
}
</script>
</body>
</html>
